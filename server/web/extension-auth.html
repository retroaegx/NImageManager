<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="extension_auth.page_title">拡張機能のログイン認証 - NIM</title>
  <link rel="stylesheet" href="/styles.css?v=41" />
</head>
<body class="loginPage">
  <div class="bg"></div>
  <div class="loginShell">
    <main class="card loginCard extensionAuthCard">
      <div class="loginBrandRow">
        <div class="loginMark">
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c3.2 0 5.9 1.8 7.2 4.4.4.8 0 1.7-.9 2.1l-2.6 1.2c-.8.4-1.7 0-2.1-.9C13 7.8 12.1 7.2 12 7.2c-1.5 0-2.8 1.3-2.8 2.8v1.2h1.6c.9 0 1.6.7 1.6 1.6v2.4c0 .9-.7 1.6-1.6 1.6H9.2V20c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2v-6.4c0-3.8 0-4.1.1-4.6C4.6 5.1 8 2 12 2Z" fill="currentColor" opacity=".92"/><path d="M20 12.2v6.2c0 1.1-.9 2-2 2h-6.1c-.9 0-1.6-.7-1.6-1.6v-2.4c0-.9.7-1.6 1.6-1.6h3.2v-2.6c0-.9.7-1.6 1.6-1.6h1.7c.9 0 1.6.7 1.6 1.6Z" fill="currentColor" opacity=".65"/></svg>
        </div>
        <div>
          <div class="loginTitle">NIM</div>
          <div class="loginSub">NovelAI Image Manager</div>
        </div>
      </div>

      <h1 class="loginH extensionAuthHeading" data-i18n="extension_auth.heading">拡張機能へのログインを許可</h1>
      <p class="extensionAuthDescription" data-i18n="extension_auth.description">現在のNImageManagerアカウントを使って拡張機能へログインします。</p>

      <section id="extensionAuthDetails" class="extensionAuthDetails hidden">
        <div class="extensionAuthRow">
          <span data-i18n="extension_auth.extension">拡張機能</span>
          <strong id="extensionAuthClient">NIM Transfer</strong>
        </div>
        <div class="extensionAuthRow">
          <span data-i18n="extension_auth.account">アカウント</span>
          <strong id="extensionAuthUser"></strong>
        </div>
      </section>

      <p id="extensionAuthMessage" class="authMessage" aria-live="polite" data-i18n="extension_auth.loading">認証要求を確認しています…</p>
      <div id="extensionAuthActions" class="row extensionAuthActions hidden">
        <button id="approveExtensionAuth" class="primaryBtn" type="button" data-i18n="extension_auth.approve">許可してログイン</button>
        <button id="denyExtensionAuth" class="secondaryBtn" type="button" data-i18n="extension_auth.deny">キャンセル</button>
      </div>
    </main>
  </div>
  <script type="module" src="/extension-auth.js?v=1.0.6-i18n1"></script>
</body>
</html>
